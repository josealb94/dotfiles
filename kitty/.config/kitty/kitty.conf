# =============================================================================
# Kitty — Configuración base (compartida macOS + Linux)
# Docs: https://sw.kovidgoyal.net/kitty/conf/
#
# Los keybinds y opciones específicas de cada OS viven en:
#   kitty.conf-linux  → keybinds alt-based + reservas de bspwm
#   kitty.conf-macos  → keybinds cmd-based + macos_option_as_alt
#
# El módulo kitty.sh crea un symlink ~/.config/kitty/kitty.conf.local
# apuntando al variant correspondiente. Este archivo lo incluye al final.
# =============================================================================

# -- Fuente -------------------------------------------------------------------
font_family       JetBrainsMono Nerd Font
font_size         14
disable_ligatures never

# -- Tema — Catppuccin Mocha --------------------------------------------------
# Paleta oficial: github.com/catppuccin/kitty (themes/mocha.conf)
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc

cursor                #f5e0dc
cursor_text_color     #1e1e2e

url_color             #f5e0dc

active_border_color   #b4befe
inactive_border_color #6c7086
bell_border_color     #f9e2af

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# ANSI / bright
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# -- Ventana ------------------------------------------------------------------
window_padding_width       8 10
background_opacity         0.88
# Permite cambiar opacity en caliente: ctrl+shift+a > m/l/1/d
dynamic_background_opacity yes

# -- Cursor -------------------------------------------------------------------
cursor_shape          block
cursor_blink_interval 0

# -- Shell --------------------------------------------------------------------
shell             zsh
shell_integration enabled

# -- Clipboard / mouse --------------------------------------------------------
copy_on_select       clipboard
strip_trailing_spaces smart
mouse_hide_wait      3.0
detect_urls          yes
url_style            curly

# -- Scrollback ---------------------------------------------------------------
scrollback_lines 50000

# -- Performance --------------------------------------------------------------
sync_to_monitor yes
repaint_delay   10
input_delay     3

# -- Bell ---------------------------------------------------------------------
enable_audio_bell no

# -- Layouts (splits estilo Ghostty) -----------------------------------------
enabled_layouts          splits,stack
window_resize_step_cells 2
window_resize_step_lines 2

# -- Tab bar ------------------------------------------------------------------
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"
tab_title_max_length 25

# =============================================================================
# Override OS-específico — keybinds y opciones de plataforma
# kitty.conf.local es un symlink → kitty.conf-{macos,linux} creado por kitty.sh.
# Si no existe, kitty emite un warning pero sigue arrancando.
# =============================================================================
include kitty.conf.local
